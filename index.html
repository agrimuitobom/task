<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生タスク管理アプリ</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- ログイン画面 -->
    <div id="login-screen" class="login-screen">
        <div class="login-container">
            <h1>📚 学生タスク管理</h1>
            <p>Googleアカウントでログインしてください</p>
            <button id="google-login-btn" class="btn-google">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                Googleでログイン
            </button>
        </div>
    </div>

    <!-- メインアプリ画面 -->
    <div class="container" id="app-container" style="display: none;">
        <header>
            <div class="header-content">
                <h1>📚 学生タスク管理</h1>
                <div class="user-info">
                    <img id="user-photo" src="" alt="User" class="user-photo">
                    <span id="user-name"></span>
                    <button id="logout-btn" class="btn-logout">ログアウト</button>
                </div>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="todo">やるべきこと</button>
            <button class="tab-btn" data-tab="calendar">カレンダー</button>
            <button class="tab-btn" data-tab="timetable">時間割</button>
            <button class="tab-btn" data-tab="homework">宿題</button>
        </div>

        <!-- やるべきことタブ -->
        <div id="todo" class="tab-content active">
            <div class="section">
                <h2>やるべきことリスト</h2>
                <div class="input-group">
                    <input type="text" id="todo-input" placeholder="新しいタスクを入力..." style="flex: 2;">
                    <input type="date" id="todo-date-input" placeholder="日付（任意）">
                    <button id="add-todo-btn" class="btn-primary">追加</button>
                </div>
                <ul id="todo-list" class="task-list"></ul>
            </div>
        </div>

        <!-- カレンダータブ -->
        <div id="calendar" class="tab-content">
            <div class="section">
                <h2>カレンダー</h2>
                <div id="calendar-view"></div>
            </div>
        </div>

        <!-- 時間割タブ -->
        <div id="timetable" class="tab-content">
            <div class="section">
                <h2>時間割</h2>
                <div class="day-selector">
                    <button class="day-btn active" data-day="月">月</button>
                    <button class="day-btn" data-day="火">火</button>
                    <button class="day-btn" data-day="水">水</button>
                    <button class="day-btn" data-day="木">木</button>
                    <button class="day-btn" data-day="金">金</button>
                </div>
                <div class="input-group">
                    <select id="period-select">
                        <option value="1">1時間目</option>
                        <option value="2">2時間目</option>
                        <option value="3">3時間目</option>
                        <option value="4">4時間目</option>
                        <option value="5">5時間目</option>
                        <option value="6">6時間目</option>
                    </select>
                    <input type="text" id="subject-input" placeholder="科目名...">
                    <button id="add-subject-btn" class="btn-primary">追加</button>
                </div>
                <div id="timetable-display"></div>
            </div>
        </div>

        <!-- 宿題タブ -->
        <div id="homework" class="tab-content">
            <div class="section">
                <h2>科目ごとの宿題</h2>
                <div class="input-group">
                    <select id="hw-subject-input">
                        <option value="">科目を選択...</option>
                    </select>
                    <input type="text" id="hw-content-input" placeholder="宿題の内容..." style="flex: 2;">
                    <input type="date" id="hw-deadline-input">
                    <button id="add-homework-btn" class="btn-primary">追加</button>
                </div>
                <div id="homework-list"></div>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
